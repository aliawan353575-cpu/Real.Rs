<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Your Project | Vantorax Studio</title>
<meta name="description" content="Tell Vantorax Studio about your remodeling business and website goals.">
<link rel="canonical" href="https://YOUR-USERNAME.github.io/vantorax/contact.html">
<meta property="og:title" content="Start Your Project | Vantorax Studio">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1f1e'/%3E%3Cpath d='M7 8l9 17 9-17' stroke='%232f6f62' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site"><div class="wrap"><a class="logo" href="index.html">Vantorax Studio</a>
<nav aria-label="Main"><ul><li><a href="index.html">Back to home</a></li></ul></nav></div></header>
<main id="main"><section><div class="wrap">
<h1 style="font-size:var(--t-h2)">Tell us about your project.</h1>
<p class="lede">Share a few details and we will reply with next steps.</p>
<div id="done" class="notice" tabindex="-1" hidden><strong>Thanks, your details are ready.</strong> This demo form does not send data yet. Connect it to a form service to receive inquiries.</div>
<form id="inquiry" novalidate>
<div class="fr"><div><label for="name">Name</label><input id="name" name="name" autocomplete="name" required><div class="err" id="name-err" role="alert"></div></div>
<div><label for="business">Business name</label><input id="business" name="business" autocomplete="organization" required><div class="err" id="business-err" role="alert"></div></div></div>
<div class="fr"><div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err" id="email-err" role="alert"></div></div>
<div><label for="website">Current website (optional)</label><input id="website" name="website" type="url" inputmode="url" placeholder="https://"></div></div>
<div class="fr"><div><label for="country">Country</label><select id="country" name="country" required><option value="">Select</option><option>United States</option><option>Canada</option><option>Australia</option><option>United Kingdom</option><option>New Zealand</option><option>Ireland</option><option>Other</option></select><div class="err" id="country-err" role="alert"></div></div>
<div><label for="budget">Budget</label><select id="budget" name="budget"><option>Not sure yet</option><option>Under $1,000</option><option>$1,000–$1,500</option><option>$1,500–$2,500</option><option>$2,500+</option></select></div></div>
<div><label for="services">Services needed</label><select id="services" name="services"><option>New website</option><option>Website redesign</option><option>Local SEO foundations</option><option>Not sure yet</option></select></div>
<div><label for="details">Project details</label><textarea id="details" name="details" rows="5" required></textarea><div class="err" id="details-err" role="alert"></div></div>
<button class="btn" type="submit">Start Your Project</button>
</form></div></section></main>
<footer><div class="wrap"><strong class="logo">Vantorax Studio</strong> <a href="index.html">Home</a></div></footer>
<script src="js/main.js" defer></script>
</body>
</html>
